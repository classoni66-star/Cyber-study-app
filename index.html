<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cyber Study Companion</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --border: #30363d;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; line-height: 1.5; }
        h1, h2 { text-align: center; color: #ffffff; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        
        /* Timer Styles */
        .timer-display { font-size: 3rem; font-weight: bold; text-align: center; margin: 10px 0; color: #58a6ff; }
        .btn-group { display: flex; justify-content: center; gap: 10px; }
        button { background-color: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 1rem; cursor: pointer; transition: 0.2s; font-weight: bold; }
        button:hover { background-color: var(--accent-hover); }
        
        /* Progress Styles */
        .progress-item { display: flex; align-items: center; margin-bottom: 10px; padding: 8px; border-bottom: 1px solid var(--border); }
        .progress-item input[type="checkbox"] { width: 20px; height: 20px; margin-right: 15px; cursor: pointer; }
        .progress-item label { font-size: 1rem; cursor: pointer; }
        
        /* Flashcard Styles */
        .card-counter { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
        .flashcard { background-color: #21262d; border-radius: 8px; padding: 20px; min-height: 150px; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; font-size: 1.1rem; margin-bottom: 15px; border: 1px solid var(--border); transition: transform 0.2s; }
        .flashcard:active { transform: scale(0.97); }
        .flashcard-actions { display: flex; gap: 10px; justify-content: space-between; }
        .flashcard-actions button { flex: 1; background-color: #21262d; border: 1px solid var(--border); }
        .flashcard-actions button:hover { background-color: #30363d; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Cyber Study App</h1>

    <!-- POMODORO TIMER -->
    <div class="card">
        <h2>Focus Timer</h2>
        <div class="timer-display" id="timer">25:00</div>
        <div class="btn-group">
            <button id="startBtn" onclick="toggleTimer()">Start</button>
            <button id="resetBtn" onclick="resetTimer()" style="background-color: #30363d;">Reset</button>
        </div>
    </div>

    <!-- PROGRESS TRACKER -->
    <div class="card">
        <h2>Course Progress</h2>
        <div id="progressList">
            <!-- Items will be generated here via JS -->
        </div>
    </div>

    <!-- FLASHCARDS -->
    <div class="card">
        <h2>Glossary Flashcards</h2>
        <div class="card-counter" id="card-counter">Card 1 of 123</div>
        <div class="flashcard" id="flashcard" onclick="flipCard()">
            Tap to reveal definition
        </div>
        <div class="flashcard-actions">
            <button onclick="shuffleCards()" style="flex: 0.5;">🔀 Shuffle</button>
            <button onclick="nextCard()">Next Card ➡️</button>
        </div>
    </div>
</div>

<script>
    // --- 1. POMODORO TIMER LOGIC ---
    let timeLeft = 25 * 60;
    let timerId = null;
    let isRunning = false;

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
        const btn = document.getElementById('startBtn');
        if (isRunning) {
            clearInterval(timerId);
            btn.innerText = 'Start';
        } else {
            if (timeLeft === 0) resetTimer();
            btn.innerText = 'Pause';
            timerId = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    isRunning = false;
                    btn.innerText = 'Start';
                    alert("Time's up! Take a 5-minute break.");
                }
            }, 1000);
        }
        isRunning = !isRunning;
    }

    function resetTimer() {
        clearInterval(timerId);
        isRunning = false;
        timeLeft = 25 * 60;
        document.getElementById('startBtn').innerText = 'Start';
        updateTimerDisplay();
    }

    // --- 2. PROGRESS TRACKER LOGIC ---
    const modules = [
        "1. Data and Privacy",
        "2. Governance, Risk, and Compliance",
        "3. Threats and Vulnerabilities",
        "4. Vulnerability Management",
        "5. System Security",
        "6. Network Security",
        "7. Cloud Computing and Virtualization",
        "8. Securing Cloud Infrastructure",
        "9. Security Operations",
        "10. Security Monitoring",
        "11. Incident Response",
        "12. Digital System Forensics",
        "13. Emerging Threats",
        "Final Capstone Project"
    ];

    function loadProgress() {
        const container = document.getElementById('progressList');
        const savedProgress = JSON.parse(localStorage.getItem('studyProgress')) || {};

        modules.forEach((mod, index) => {
            const isChecked = savedProgress[index] ? "checked" : "";
            const div = document.createElement('div');
            div.className = 'progress-item';
            div.innerHTML = `
                <input type="checkbox" id="mod${index}" ${isChecked} onchange="saveProgress(${index}, this.checked)">
                <label for="mod${index}">${mod}</label>
            `;
            container.appendChild(div);
        });
    }

    function saveProgress(index, isChecked) {
        let savedProgress = JSON.parse(localStorage.getItem('studyProgress')) || {};
        savedProgress[index] = isChecked;
        localStorage.setItem('studyProgress', JSON.stringify(savedProgress));
    }

    // --- 3. FLASHCARD LOGIC (MODULES 1-5 EXTRACTED FROM PDF) ---
    const flashcards = [
        // Module 1
        { term: "Administrative controls", definition: "Guidelines, policies, and procedures written to meet and enforce security goals." },
        { term: "Antimalware (antivirus) software", definition: "Software that detects, quarantines, and destroys malware that threatens data or networks." },
        { term: "Asymmetric encryption", definition: "An encryption process that involves using two keys: a public key to encrypt data and a private key to decrypt it." },
        { term: "Availability", definition: "An objective of the CIA triad that means ensuring timely and reliable access to and use of data." },
        { term: "Authentication", definition: "A measure to verify the source of a message." },
        { term: "A1Z26 cipher", definition: "An encryption process that replaces each plaintext letter with a number corresponding to that letter's order in the alphabet." },
        { term: "Backup software", definition: "Software that creates extra copies of data that can be used to recover critical data lost due to breaches, system failures, or other security events." },
        { term: "Brute force attack", definition: "A cyberattack in which the attacker tries different passwords until they find one that works." },
        { term: "Caesar cipher", definition: "An encryption process that replaces each plaintext letter with the letter three places before or after it in the alphabet." },
        { term: "CIA triad", definition: "An information security model with confidentiality, integrity, and availability as the objectives of data protection." },
        { term: "Cipher", definition: "A set of transformations that convert plaintext, the intelligible, human-readable data, into ciphertext, the data's encrypted form." },
        { term: "Cloud DLP", definition: "A type of data loss prevention that involves detecting and encrypting sensitive data before it is stored in the cloud." },
        { term: "Confidential data", definition: "Data that an organization protects from unauthorized access, such as proprietary information, source code, employee records, personally identifiable information (PII), and protected health information (PHI)." },
        { term: "Confidentiality", definition: "An objective of the CIA triad that means protecting data by ensuring that only authorized people can access or disclose it." },
        { term: "Control", definition: "A measure that you can take to mitigate risks. Controls come in three types: administrative, physical, and technical." },
        { term: "Cyberattacker (attacker)", definition: "A hacker who tries to bypass system or network security to access data without authorization for malicious purposes." },
        { term: "Data at rest", definition: "Data residing in a storage device." },
        { term: "Data erasure software", definition: "Software that permanently clears a repository's unneeded or unused data." },
        { term: "Data in motion (Data in transit)", definition: "Data that is actively moving across a network or between systems." },
        { term: "Data in use", definition: "Data that a computer or application is actively using and processing." },
        { term: "Data loss prevention (DLP) systems", definition: "Processes, procedures, and tools that help detect and prevent data loss." },
        { term: "Data privacy", definition: "Data security focused only on preventing unauthorized collection, disclosure, or use of customers' and employees' private data." },
        { term: "Data security", definition: "How an organization protects confidential data from unauthorized access, disclosure, or destruction." },
        { term: "Differential backups", definition: "A data backup process that starts with a full backup, and then each additional backup includes only the changes made since the last full backup." },
        { term: "Encryption", definition: "Technical control that ensures data confidentiality by converting readable data into an unreadable form." },
        { term: "Encryption software", definition: "Software that converts data into a format that unauthorized people cannot understand, preserving confidentiality." },
        { term: "Endpoint DLP", definition: "A system that monitors all endpoints for data loss or leakage." },
        { term: "File encryption", definition: "The process of encrypting files or file systems so that only those with the key can access them." },
        { term: "File-level DLP", definition: "A system that identifies sensitive files in a file system." },
        { term: "Full backups", definition: "A data backup process in which you copy the entire content of your system or device." },
        { term: "Full drive encryption", definition: "The process of encrypting an entire hard disk, including its data, files, programs, and operating system." },
        { term: "Generally Accepted Privacy Principles (GAPP)", definition: "A standard for data privacy developed by the American Institute of Certified Public Accountants (AICPA) and the Canadian Institute of Chartered Accountants (CICA)." },
        { term: "Hacker", definition: "Someone who tries to bypass system or network security to access data." },
        { term: "Hard disk encryption", definition: "The process of encrypting data stored on a hard disk and new files being added." },
        { term: "Incremental backups", definition: "A data backup process that captures only the changes made since the last backup." },
        { term: "Integrity", definition: "An objective of the CIA triad that means protecting data from unauthorized modification and destruction to ensure it is trustworthy and accurate." },
        { term: "Malware", definition: "Software or firmware intended to conduct unauthorized actions that negatively affect system security." },
        { term: "Monoalphabetic cipher", definition: "An encryption process that replaces each plaintext letter with another letter in the alphabet. For example, maybe all A's become Z's and all B's become Y's." },
        { term: "Network DLP", definition: "A system that protects data at rest, in motion, or in use on an organization's network." },
        { term: "Network encryption", definition: "Encryption used to protect sensitive data in motion between the server and the client." },
        { term: "Non-repudiation", definition: "Assurance that neither the sender nor the receiver of a message can deny its transmission; the sender receives proof of delivery, and the receiver receives proof of the sender's identity." },
        { term: "Personally identifiable information (PII)", definition: "Private data that can be used to identify someone, such as birthdays, addresses, phone numbers, and government-issued ID numbers." },
        { term: "Physical controls", definition: "Devices or structures designed to restrict access to areas or devices containing sensitive data. Common examples include fences, locks, key cards, security cameras, alarms, and cabinets." },
        { term: "Private data", definition: "Data about a person and their private life that other parties should not be able to collect, use, or disclose unless authorized. Some examples include financial activity, credit card numbers, email login credentials, personally identifiable information (PII), and protected health information (PHI)." },
        { term: "Proprietary data", definition: "Organization-owned or organization-generated data relevant to the organization's products or actions that must remain confidential." },
        { term: "Protected health information (PHI)", definition: "Private data in medical records used to identify someone, such as diagnoses, test results, prescriptions, and health insurance information." },
        { term: "Public data", definition: "Data that anyone can access, use, and redistribute without restriction." },
        { term: "Symmetric encryption", definition: "An encryption process that involves using a single private key to encrypt and decrypt data." },
        { term: "Technical controls", definition: "Hardware or software that helps secure data or processes. Common examples include antimalware software and encryption software." },
        { term: "Threat", definition: "Something that can cause harm to a network, system, or data." },
        { term: "Vulnerability", definition: "A weakness in hardware, firmware, or software that a hacker can exploit." },

        // Module 2
        { term: "California Consumer Privacy Act (CCPA)", definition: "A data privacy law that applies to any organization that does business in California and must share with customers the data it collects about them and their children." },
        { term: "Compliance controls", definition: "Risk-based controls that companies implement to protect confidentiality, integrity, and availability of data and comply with laws, regulations, and standards." },
        { term: "Compliance (in cybersecurity)", definition: "An organization's adherence to applicable laws, regulations, and standards designed to keep data and systems safe from cyberthreats." },
        { term: "Disaster preparedness plan", definition: "A written plan that lists the precautions that an organization takes to prevent or mitigate the harm that disasters cause." },
        { term: "Disaster recovery plan (DRP)", definition: "A written plan for recovering data or systems if a disaster occurs." },
        { term: "Federal Educational Rights and Privacy Act (FERPA)", definition: "A US federal law designed to keep student education records private. The law requires that schools implement appropriate controls, such as policies, procedures, and training, to prevent unauthorized access, disclosure, and use of those records." },
        { term: "General Data Protection Regulation (GDPR)", definition: "An extensive data privacy law and regulation that applies to any company that hosts the data of EU residents or does business with EU countries." },
        { term: "Gramm-Leach-Bliley Act (GLBA)", definition: "A US federal law that requires financial institutions and companies that offer US consumers financial products or services to disclose their data-sharing practices to customers." },
        { term: "Governance", definition: "The process of making and enforcing decisions within an organization. It defines how a governing body structures and sustains rules, norms, and actions and how it holds everyone accountable for them." },
        { term: "Governance, risk, and compliance (GRC)", definition: "A structured way to align an organization's business goals with its recognition of risk and risk mitigation to meet all government and industry regulations and standards." },
        { term: "Guideline", definition: "A recommended, not required, way to perform a task at an organization. For example, a company guideline might be that employees use a specific PowerPoint template for all internal meetings. But if an employee violates this guideline, they'll probably receive a reminder, not a punishment." },
        { term: "Health Insurance Portability and Accountability Act (HIPAA)", definition: "A US federal law that defines the control of protected health information (PHI), such as medical records and diagnoses. HIPAA's Privacy Rule places strict restrictions on access and disclosure of someone's PHI. HIPAA's Security Rule establishes standards for protecting PHI." },
        { term: "IEEE 802 networking standards", definition: "Industry-standard guidance for securing area networks of various sizes. For example, the standards cover network access, encryption, and threat detection." },
        { term: "ISO 2700 and ISO 27001", definition: "International standards for a wide range of cybersecurity topics, such as assessing risks, creating information security management systems, and deploying security controls." },
        { term: "Law", definition: "A legal requirement established by a congress, parliament, or other legislative group. Laws tend to be broad in scope. Violating them can lead to penalties, fines, and other legal consequences. In the context of cybersecurity, laws protect data and punish those who violate its confidentiality, integrity, or availability without proper authorization." },
        { term: "Multiparty risks", definition: "Risks that impact more than one organization. A common example is an internet or service provider outage." },
        { term: "National Institute of Standards and Technology (NIST)", definition: "A US federal agency dedicated to advancing American technology and innovation that provides extensive cybersecurity resources, including hundreds of cybersecurity and data privacy standards." },
        { term: "NIST risk management framework (RMF)", definition: "A comprehensive, repeatable, and measurable approach to managing data security and privacy risk. It includes seven steps." },
        { term: "NYDFS Cybersecurity Regulation", definition: "A New York state regulation that requires financial institutions doing business in the state to perform risk management." },
        { term: "Payment Card Industry Data Security Standard (PCI DSS)", definition: "A data security standard for credit cards that applies to organizations storing or transmitting credit card data." },
        { term: "Procedure", definition: "Step-by-step processes for completing a task to meet a standard or guideline." },
        { term: "Policy", definition: "A broad statement about the overall intent of an organization and how it should be run, including details about the organization's goals, intentions, and values that the organization must defend with the security framework." },
        { term: "Regulation", definition: "A legal requirement, established by a government agency, intended to interpret and implement a law. Regulations clarify what organizations must do to stay within the law. Non-compliance with regulations can lead to penalties, fines, and other legal consequences." },
        { term: "Risk", definition: "The extent to which a potential cyberattack or other event threatens an organization's operations." },
        { term: "Risk assessment", definition: "A process of identifying risks, evaluating their impact, and deciding what to do about them." },
        { term: "Risk management", definition: "Process of identifying, assessing, and controlling financial, legal, strategic, and security risks to an organization's capital and earnings." },
        { term: "Risk tolerance", definition: "Level of risk or degree of uncertainty that is acceptable to organizations." },
        { term: "Standard (in compliance)", definition: "A set of guidelines or best practices created by experts, industry groups, or governments that organizations might follow." },
        { term: "Standard (in governance)", definition: "A measurable requirement that all employees in an organization must follow. Common examples include configuration settings for devices or requirements for using company equipment." },

        // Module 3
        { term: "Adware", definition: "Advertising-supported software that automatically displays unsolicited advertisements on a device." },
        { term: "Bot (standard definition)", definition: "A program that performs automated tasks over a network. A common example is a chatbot performing customer service." },
        { term: "Bot (specifically, a malicious bot or zombie)", definition: "An internet-connected device infected with malware that enables the attacker to control the device remotely. Often referred to as a bot in cybersecurity." },
        { term: "Botnet", definition: "A network of malicious bots that an attacker controls under the same instance to launch cyberattacks." },
        { term: "Defense in depth", definition: "A strategy in which you use multiple layers of security controls to protect assets. For example, an employee might have to pass physical controls, such as a security guard and security cameras, before successfully entering their login credentials, a technical control." },
        { term: "Door access control systems", definition: "Systems that restrict entrance to only those with the correct credentials." },
        { term: "Dumpster diving", definition: "When someone searches a person's or organization's trash for confidential information." },
        { term: "Electromagnetic interference (EMI)", definition: "Interference caused by electromagnetic radiation that can hinder hardware performance. EMI typically comes from electronic devices, such as computers, cell phones, microwaves, and LED lights." },
        { term: "EMI shielding", definition: "A technique that encloses equipment, such as audio-video (AV) and ethernet cables, within conductive or magnetic materials to block external electromagnetic waves." },
        { term: "Keylogger", definition: "Spyware that records each keystroke that you make on your device." },
        { term: "Logic bomb", definition: "Malware saved in a file or embedded in software that activates only when specific conditions are met, such as a specific time of the day." },
        { term: "Malware (Module 3)", definition: "Software designed to threaten the confidentiality, integrity, or availability of data or systems." },
        { term: "Malwarebytes", definition: "An antimalware program that detects and removes malware such as viruses, exploits, and ransomware." },
        { term: "Malware signature", definition: "A pattern of attributes that corresponds to known malware. When antimalware software identifies a signature in a file, the software deletes the file, quarantines it, or alerts you that the file might be infected." },
        { term: "Patch management (Module 3)", definition: "The process of updating software to add new features or fix vulnerabilities." },
        { term: "Phishing", definition: "The practice of sending messages, seemingly from a legitimate organization, to trick users into providing confidential information." },
        { term: "Physical threat", definition: "A direct threat to assets, such as unauthorized intrusion into a restricted area and natural hazards such as fires." },
        { term: "Shoulder surfing", definition: "When an attacker steals your personal information by looking over your shoulder as you use a computer or device." },
        { term: "Social engineering", definition: "The use of deception to trick people into divulging confidential or private information for fraudulent purposes." },
        { term: "Spear phishing", definition: "A type of phishing that targets a specific person, group, or organization." },
        { term: "Tailgating", definition: "When an unauthorized person enters a restricted area by following behind an authorized person." },
        { term: "Ransomware", definition: "Malware that holds your system hostage, infects it, restricts access to it or its data, and instructs you to pay a ransom to regain access." },
        { term: "Spyware", definition: "Malware installed secretly on a device or system to collect and report data, such as keystrokes, web browsing habits, download history, and other internet behavior." },
        { term: "Trojan", definition: "A seemingly helpful program designed to give an attacker access to a device secretly to control remotely, steal data, spy on activity, install malware, or perform other malicious actions." },
        { term: "Virus", definition: "Malware that attaches to a device's files or programs to replicate itself and then spreads to another device." },
        { term: "Worms", definition: "Malware that self-replicates without needing a host device's files or programs and then spreads across systems." },
        { term: "Zero-day vulnerability", definition: "A previously unknown security flaw in software that haven't been fixed." },

        // Module 4
        { term: "Cross-site scripting (XSS)", definition: "An attack that inserts malicious code into a client web page. When a user accesses the page, their browser recognizes the code as coming from a trusted site, enabling the code to run." },
        { term: "Cyberattacker (Module 4)", definition: "Someone who tries to bypass system or network security without authorization for malicious purposes." },
        { term: "Ethical hacker or offensive security researcher", definition: "A hacker who works with organizations to identify and fix vulnerabilities, not exploit them for malicious purposes." },
        { term: "Exploitation frameworks", definition: "Tools that provide repositories of prebuilt cyberattacks and exploits. For example, with the Metasploit application, you can search for attacks tailored to a specific version of an OS that you want to target and then let Metasploit perform the attack." },
        { term: "Expression", definition: "A combination of code components that a program can interpret and use." },
        { term: "Footprinting or reconnaissance", definition: "The act of profiling a system and its users to gather threat intelligence. For example, a pen tester might collect a network's IP addresses and domain names and determine its topology." },
        { term: "Host", definition: "A device, such as a server or laptop, that can communicate with other devices on a network and grant access to devices outside the network." },
        { term: "Indicators of compromise (IOCs)", definition: "The symptoms or evidence of a cyberattack. For example, the subject line of a suspicious email might match that of a known phishing scam." },
        { term: "Intelligence", definition: "Information and knowledge about an adversary obtained through observation, investigation, analysis, or understanding." },
        { term: "JavaScript Object Notation (JSON)", definition: "A standard text-based data format that uses human-readable text that can be easily stored and transmitted using an automated system." },
        { term: "Network mappers", definition: "Tools to find and map out all devices on a network and discover data about each device, such as its IP address." },
        { term: "Open port", definition: "A network port that accepts a connection. Attackers want to find and exploit open ports, while network administrators want to close or block them while ensuring that legitimate users still have access." },
        { term: "Open-source intelligence (OSINT)", definition: "Intelligence that anyone can create from publicly available information. Common sources of OSINT include blogs, libraries, news organizations, company websites, social media, and public records." },
        { term: "Operational intelligence", definition: "Intelligence that helps security teams anticipate and prevent future attacks." },
        { term: "OWASP ZAP", definition: "A free, open-source vulnerability scanner and penetration testing tool designed for testing a web application's security." },
        { term: "Packet analyzer", definition: "A tool that captures and inspects data in transit across a network." },
        { term: "Penetration testing", definition: "A type of security testing that simulates real hacking techniques to find application, network, or system vulnerabilities that attackers can exploit." },
        { term: "Port scanner", definition: "A program that identifies a network's open or available ports." },
        { term: "Spider or web crawler", definition: "A program that searches and indexes web content." },
        { term: "Strategic intelligence", definition: "High-level intelligence about current worldwide trends in cyberthreats." },
        { term: "Structured Threat Information Expression (STIX)", definition: "An open-source programming language that provides a standardized format for sharing threat intelligence." },
        { term: "SQL injection", definition: "A cyberattack that places malicious code into a Structured Query Language (SQL) statement through an application or web page. Attackers typically use a user input request, such as a username, to enter the SQL statement, which runs on the server database." },
        { term: "Tactical intelligence", definition: "Intelligence that helps security teams detect and respond to cyberattacks in real time." },
        { term: "Threat actor (malicious actor)", definition: "An entity, such as a person, group, or organization, that poses a cybersecurity threat." },
        { term: "Threat intelligence", definition: "Intelligence that helps organizations make informed decisions about cybersecurity threats." },
        { term: "Vulnerability assessment", definition: "A systematic process in which you identify and evaluate system, network, or application vulnerabilities to determine security risk." },
        { term: "Vulnerability scan", definition: "A software-assisted evaluation of a system for known vulnerabilities." },
        { term: "Vulnerability scanner", definition: "An application that scans a system for known vulnerabilities." },

        // Module 5
        { term: "Application server", definition: "A server that connects clients to software applications through virtual server connections." },
        { term: "Bootkit", definition: "Malware that infects a computer's boot loader or master boot record (MBR), which is responsible for starting the operating system." },
        { term: "Boot program", definition: "Software that loads the operating system into the computer, allowing applications to interact with its hardware." },
        { term: "Client", definition: "A device connected to a network." },
        { term: "Collaboration server", definition: "A server that allows multiple users to share and store files, applications, and large amounts of data." },
        { term: "Common Weakness Enumeration (CWE)", definition: "A community-developed list of software weaknesses that can lead to security vulnerabilities in firmware." },
        { term: "Database server", definition: "A server that functions as a large storage space that the organization uses and accesses to run multiple programs." },
        { term: "Domain name system (DNS) server", definition: "A server that transforms readable computer domain names into computer language internet protocol (IP) addresses, taking search data from a user to find the requested address to deliver to another device." },
        { term: "File server", definition: "A server that stores data files for multiple users and allows for faster data retrieval." },
        { term: "Firmware", definition: "A critical computer program embedded in a device for controlling its specific hardware functions, such as system startup and interacting with a router." },
        { term: "File transfer protocol (FTP) server", definition: "A server that relocates files from one computer to another. File transfer protocol also refers to using a server to connect one computer to another to share data safely." },
        { term: "Gaming server", definition: "A server that hosts multiplayer online games. Large gaming networks use servers to connect users from around the world." },
        { term: "High-level firmware", definition: "Firmware used with flash memory chips for updating and typically has more complex instructions than low-level firmware." },
        { term: "Jailbreaking", definition: "A method used to gain access to the underlying operating system of an iPhone." },
        { term: "Kernel", definition: "Software that manages essential components of the operating system, such as managing memory and device drivers and scheduling processes, and ensures proper coordination between hardware and software." },
        { term: "Low-level firmware", definition: "Firmware stored on a non-volatile memory chip, such as read-only memory (ROM). It provides the most basic control for a device's hardware, typically managing the hardware's initial startup processes." },
        { term: "Mail server", definition: "A server that stores and delivers mail for clients through email service platforms." },
        { term: "Mobile OS", definition: "An operating system developed specifically to run on a mobile device. Well-known examples include iOS and Android." },
        { term: "Monitoring and management server", definition: "A server designed for recording and tracking digital transactions and receiving user requests." },
        { term: "Operating system (OS)", definition: "A type of software that manages all a computer's applications, programs, and hardware resources and provides a user interface for interacting with the computer." },
        { term: "OS security", definition: "Process of ensuring the OS's confidentiality, integrity, and availability. It involves protecting the OS from threats, such as viruses, worms, malware, and remote hacker intrusions." },
        { term: "Patch management (Module 5)", definition: "Process for keeping computers and networks secure, reliable, and up-to-date with necessary features and functionality." },
        { term: "Print server", definition: "A server that connects remotely to local computers to print through a network. With these servers, organizations can use a single printer to serve an entire department." },
        { term: "Proxy server", definition: "A server that intercepts data sent by a website to then send it to a computer's IP address." },
        { term: "Rooting", definition: "A method used to gain access to the underlying operating system of an Android device." },
        { term: "Rootkit", definition: "Malware designed to hide its presence and activities from the user and the operating system's security mechanisms." },
        { term: "Server", definition: "A specialized device or software system that stores and processes data and acts as a central hub in a network, providing this data to other devices in the network." },
        { term: "Server OS", definition: "An operating system developed specifically to manage and run a server. Examples of widely-used server OSs include Red Hat Enterprise Linux Server and Windows Server." },
        { term: "Software", definition: "A set of instructions and data that tells a computer how to perform specific tasks. It includes programs and applications that help users accomplish various activities, such as browsing the internet, writing documents, or playing games." },
        { term: "Subsystem firmware (device firmware)", definition: "Specialized firmware that functions independently of the main system firmware. For example, a printer operates with its own firmware, but firmware is also embedded in the ink cartridge chip to manage communication with the printer about ink levels." },
        { term: "System hardening", definition: "The process of securing a computer system or server by mitigating potential vulnerabilities." },
        { term: "Web server", definition: "A server that accesses the World Wide Web through public domain software. It connects the stored information from an internet website to the user's computer." },
        { term: "Workstation OS", definition: "An operating system developed specifically to run on desktop or laptop computers. Windows, macOS, and Linux are some of the most well-known workstation operating systems." }
    ];

    let currentCardIndex = 0;
    let isFlipped = false;

    function updateCounter() {
        document.getElementById('card-counter').innerText = `Card ${currentCardIndex + 1} of ${flashcards.length}`;
    }

    function showCard() {
        const cardElement = document.getElementById('flashcard');
        const card = flashcards[currentCardIndex];
        isFlipped = false;
        cardElement.innerText = card.term;
        cardElement.style.color = "#58a6ff"; // Blue for term
        updateCounter();
    }

    function flipCard() {
        const cardElement = document.getElementById('flashcard');
        const card = flashcards[currentCardIndex];
        
        if (!isFlipped) {
            cardElement.innerText = card.definition;
            cardElement.style.color = "#c9d1d9"; // White for definition
            isFlipped = true;
        } else {
            cardElement.innerText = card.term;
            cardElement.style.color = "#58a6ff";
            isFlipped = false;
        }
    }

    function nextCard() {
        currentCardIndex = (currentCardIndex + 1) % flashcards.length;
        showCard();
    }

    function shuffleCards() {
        // Fisher-Yates Shuffle algorithm
        for (let i = flashcards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
        }
        currentCardIndex = 0;
        showCard();
    }

    // --- INITIALIZATION ---
    window.onload = () => {
        updateTimerDisplay();
        loadProgress();
        showCard();
    };
</script>
